name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # The wheel must work on its own: template, fonts and prompts included.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Build and verify the example from the wheel
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          uvx --from "$wheel" honest-cv build examples/ada -l en -l es -o "$RUNNER_TEMP/out"
          uvx --from "$wheel" honest-cv verify "$RUNNER_TEMP"/out/*.pdf
          uvx --from "$wheel" honest-cv score examples/ada -k "Kubernetes,Terraform" -p "Rust"
