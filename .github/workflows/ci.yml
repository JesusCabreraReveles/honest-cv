name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  package:
    # The wheel must work on its own: template, fonts, prompts and checklists
    # included, and no output that a Windows console can't encode.
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Run the CLI from the wheel
        shell: bash
        run: |
          wheel=$(ls dist/*.whl)
          run() { uvx --from "$wheel" honest-cv "$@"; }
          run build examples/ada -l en -l es -o out
          run verify out/*.pdf
          run score examples/ada -k "Kubernetes,Terraform" -p "Rust"
          run checklist list
          run checklist new examples/ada backend-jvm platform-sre -o out/checklist.md
          run import out/imported tests/fixtures/resume.json
          run build out/imported -o out/imported-cv
          printf 'I led a 40-service migration to Kubernetes on AWS.\n' > out/letter.txt
          run letter check examples/ada out/letter.txt
