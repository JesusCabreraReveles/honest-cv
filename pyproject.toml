[project]
name = "honest-cv"
version = "0.0.1"
description = "Honest, ATS-safe, per-role CVs generated by your AI agent (MCP server + CLI + Claude Code skill)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jesus Cabrera" }]
keywords = ["cv", "resume", "ats", "mcp", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
    "typst>=0.15",
]

[project.scripts]
honest-cv = "honest_cv.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honest_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
