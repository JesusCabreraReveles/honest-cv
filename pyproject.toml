[project]
name = "honest-cv"
dynamic = ["version"]
description = "Honest, ATS-safe, per-role CVs generated by your AI agent (MCP server + CLI + Claude Code skill)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jesus Cabrera" }]
keywords = ["cv", "resume", "ats", "mcp", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "pdfminer.six>=20231228",
    "typst>=0.15",
]

[project.urls]
Homepage = "https://github.com/JesusCabreraReveles/honest-cv"
Repository = "https://github.com/JesusCabreraReveles/honest-cv"
Issues = "https://github.com/JesusCabreraReveles/honest-cv/issues"
Changelog = "https://github.com/JesusCabreraReveles/honest-cv/blob/master/CHANGELOG.md"

[project.scripts]
honest-cv = "honest_cv.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/honest_cv/__init__.py"  # the one place the version is written

[tool.hatch.build.targets.wheel]
packages = ["src/honest_cv"]

# The sdist carries what is needed to build and test the package, nothing from
# the repo's own tooling (CLAUDE.md, .mcp.json, spike/, docs/).
[tool.hatch.build.targets.sdist]
include = [
    "/src/honest_cv",
    "/tests",
    "/examples",
    "/skills",
    "/README.md",
    "/README.es.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
# .claude/skills/honest-cv is a symlink to skills/honest-cv. Hatchling walks each
# real directory once, so unless .claude is skipped the symlink claims it and
# skills/ is left out.
exclude = ["/.claude"]
skip-excluded-dirs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
